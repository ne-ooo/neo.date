name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  LPM_VERSION: "0.74.1"

jobs:
  node:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["18.20.8", "20", "22", "24"]

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.node }}

      - name: Install LPM
        run: npm install --global "@lpm-registry/cli@${LPM_VERSION}"

      - name: Install locked dependencies
        run: lpm ci --no-skills --no-editor-setup --no-security-summary

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  timezone:
    name: TZ ${{ matrix.timezone }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        timezone:
          - UTC
          - America/New_York
          - Europe/London
          - Asia/Tokyo
          - Pacific/Auckland
    env:
      TZ: ${{ matrix.timezone }}

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"

      - name: Install LPM
        run: npm install --global "@lpm-registry/cli@${LPM_VERSION}"

      - name: Install locked dependencies
        run: lpm ci --no-skills --no-editor-setup --no-security-summary

      - name: Test timezone behavior
        run: npm test

  package:
    name: Security and package smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "18.20.8"

      - name: Install LPM
        run: npm install --global "@lpm-registry/cli@${LPM_VERSION}"

      - name: Install locked dependencies
        run: lpm ci --no-skills --no-editor-setup --no-security-summary

      - name: Audit dependencies
        run: npm run security:audit

      - name: Verify dependency signatures
        run: lpm audit signatures --json

      - name: Smoke-test packed ESM and CJS consumers
        run: npm run test:package
